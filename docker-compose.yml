version: '3.8'

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build:
      context: .
      dockerfile: backend.Dockerfile
    command: uvicorn backend.app.main:app --host 0.0.0.0 --port 8000
    volumes:
      - ./storage:/storage
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite+aiosqlite:////storage/platform.db
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=09d25e094faa6ca2556c818166b7a9563b93f7099f6f0f4caa6cf63b88e8d3e7
    depends_on:
      - redis

  celery_worker:
    build:
      context: .
      dockerfile: backend.Dockerfile
    command: celery -A backend.app.tasks.tasks.celery_app worker --loglevel=info
    volumes:
      - ./storage:/storage
    environment:
      - DATABASE_URL=sqlite+aiosqlite:////storage/platform.db
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
      - backend

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend
